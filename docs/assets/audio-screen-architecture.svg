   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">13 / PRACTICAL NATIVE-INPUT MODEL</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Listen to the command. Read the screen. Decide.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">Compact pretrained input encoders are a starting hypothesis; fusion and decision heads are trained</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="177.677812" transform="rotate(-0 52.56 177.677812)">Screenshot</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="52.56" y="206.850312" transform="rotate(-0 52.56 206.850312)">Global view + legible tiles</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="303.677812" transform="rotate(-0 52.56 303.677812)">Speech / audio</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="52.56" y="333.915937" transform="rotate(-0 52.56 333.915937)">Waveform-derived features</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="429.677813" transform="rotate(-0 52.56 429.677813)">Question / history</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="52.56" y="459.915937" transform="rotate(-0 52.56 459.915937)">Context + candidate semantics</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="358.56" y="177.677812" transform="rotate(-0 358.56 177.677812)">Visual encoder</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="358.56" y="206.850312" transform="rotate(-0 358.56 206.850312)">Preserve spatial positions</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="358.56" y="303.677812" transform="rotate(-0 358.56 303.677812)">Acoustic encoder</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="358.56" y="332.850312" transform="rotate(-0 358.56 332.850312)">Preserve time + presence</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="660.96" y="177.677812" transform="rotate(-0 660.96 177.677812)">Trainable fusion + heads</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(660.96 206.850312)">Speech intent</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(660.96 222.800312)">Independent sound-event labels</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(660.96 238.653203)">Screen state / target scores</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(660.96 254.700312)">Action + target or abstention</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="655.2" y="446.4" transform="rotate(-0 655.2 446.4)">Compare with ASR + vision</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="655.2" y="480.24" transform="rotate(-0 655.2 480.24)">Include encoder and proposal costs</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="559.158047" transform="rotate(-0 39.6 559.158047)">Proposed architecture. Frozen encoders are not jointly learned here; any target proposal stage needs its own recall test.</text>
   </g>
