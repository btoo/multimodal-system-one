   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">08 / CAUSAL TASK CONTROLS</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Change the evidence. Check what must change.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">Three hand-constructed illustrations of a relation task · oracle answers, not predictions</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="154.8" transform="rotate(-0 39.6 154.8)">Base scene</text>
   </g>
   <g id="text_5">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14283e" transform="translate(54 384.27375)">Is the red circle LEFT</text>
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14283e" transform="translate(54 401.11125)">of the blue square?</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="54" y="457.2" transform="rotate(-0 54 457.2)">TRUE</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="360" y="154.8" transform="rotate(-0 360 154.8)">Change only the image</text>
   </g>
   <g id="text_8">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14283e" transform="translate(374.4 384.27375)">Is the red circle LEFT</text>
