    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ba4563" x="694.8" y="457.2" transform="rotate(-0 694.8 457.2)">FALSE</text>
   </g>
   <g id="text_13">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="559.158047" transform="rotate(-0 39.6 559.158047)">Also change irrelevant distractors: predictions should then stay stable. Split related scene variants together.</text>
