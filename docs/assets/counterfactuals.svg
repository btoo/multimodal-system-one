   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 20px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #ba4563" x="374.4" y="457.2" transform="rotate(-0 374.4 457.2)">FALSE</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="680.4" y="154.8" transform="rotate(-0 680.4 154.8)">Change only the question</text>
   </g>
   <g id="text_11">
    <text style="font-size: 12px; font-family: 'DejaVu Sans'; fill: #14283e" transform="translate(694.8 384.27375)">Is the red circle RIGHT</text>
