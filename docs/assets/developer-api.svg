   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">15 / DEVELOPER INTERFACE</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Multimodal content in. Typed decisions out.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">HTTP transport wraps the neural scorer; candidate meanings determine the prediction task</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="184.877812" transform="rotate(-0 52.56 184.877812)">Observation blocks</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 214.050313)">Image pixels + recorded audio</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 230.000313)">Question text + answer meanings</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="349.717969" transform="rotate(-0 52.56 349.717969)">Named questions</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 379.650313)">Choice · Noul · Score · Ranking</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 395.600313)">Independent questions, shared input</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="340.56" y="184.117969" transform="rotate(-0 340.56 184.117969)">Validate the model contract</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(340.56 215.115938)">Decode bounded inline media</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(340.56 230.000313)">Check vocabulary and input limits</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="340.56" y="349.717969" transform="rotate(-0 340.56 349.717969)">Cached neural checkpoint</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(340.56 379.650313)">Encode audio and image once</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(340.56 395.600313)">Fuse each question; score candidates</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="668.16" y="184.877812" transform="rotate(-0 668.16 184.877812)">Typed result per question</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(668.16 214.050313)">Choice → categorical probabilities</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(668.16 230.000313)">Noul → probability of yes</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="668.16" y="349.717969" transform="rotate(-0 668.16 349.717969)">Deterministic result views</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(668.16 379.650313)">Score → weighted rubric values</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(668.16 395.600313)">Ranking → sorted candidate scores</text>
   </g>
   <g id="text_16">
    <text style="font-weight: 700; font-size: 15px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="46.8" y="511.2" transform="rotate(-0 46.8 511.2)">Model capability is versioned separately from API capability.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="46.8" y="545.76" transform="rotate(-0 46.8 545.76)">v2: one spoken keyword + generated panel. Structured JSON and low latency do not establish task accuracy.</text>
   </g>
   <g id="text_18">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="602.358047" transform="rotate(-0 39.6 602.358047)">Interface architecture, not a benchmark. The model predicts distributions; ordinary code applies ranking, rubric values, and abstention.</text>
   </g>
  </g>
 </g>
