   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="372.96" y="184.877812" transform="rotate(-0 372.96 184.877812)">Joint state · 6 tokens</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(372.96 214.050312)">4 visual + position tokens</text>
