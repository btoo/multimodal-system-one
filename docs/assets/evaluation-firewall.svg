   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">10 / EVALUATION DESIGN</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Four data roles. Four different permissions.</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">Scene families are separated before rendering, paraphrasing, or candidate generation</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="56.16" y="180.516953" transform="rotate(-0 56.16 180.516953)">TRAIN</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(56.16 210.450313)">Update model weights</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(56.16 226.400313)">Generate learning examples</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="297.36" y="180.516953" transform="rotate(-0 297.36 180.516953)">DEVELOPMENT</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(297.36 210.450313)">Compare hypotheses</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(297.36 227.465938)">Choose a model</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="538.56" y="180.516953" transform="rotate(-0 538.56 180.516953)">CALIBRATION</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(538.56 210.450313)">Fit temperature</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(538.56 227.465938)">Set decision thresholds</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="779.76" y="180.516953" transform="rotate(-0 779.76 180.516953)">FINAL TEST</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(779.76 210.450313)">Report frozen decisions</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(779.76 226.400313)">No tuning feedback</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="46.8" y="414" transform="rotate(-0 46.8 414)">Optimize</text>
   </g>
   <g id="text_13">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e62bc" x="288" y="414" transform="rotate(-0 288 414)">Select</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #b26614" x="529.2" y="414" transform="rotate(-0 529.2 414)">Adjust probabilities</text>
   </g>
   <g id="text_15">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #7850a8" x="770.4" y="414" transform="rotate(-0 770.4 414)">Measure transfer</text>
   </g>
   <g id="text_16">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="46.8" y="489.6" transform="rotate(-0 46.8 489.6)">A final test used to revise the design becomes development evidence for the next campaign.</text>
   </g>
   <g id="text_17">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="559.158047" transform="rotate(-0 39.6 559.158047)">Procedural separation only. A file named 'test' is not a security boundary, and repeated selection can still overfit.</text>
   </g>
