   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">16 / VISUAL REPRESENTATION EXPERIMENT</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Test a visual prior separately from model size</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">An explicit generated-panel assumption: dark glyphs can be separated from the colored tile fill</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: middle; fill: #14283e" x="144" y="165.6" transform="rotate(-0 144 165.6)">Same glyph, four colors</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="318.96" y="184.877812" transform="rotate(-0 318.96 184.877812)">Dark-ink shape map</text>
   </g>
   <g id="text_6">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="318.96" y="214.050312" transform="rotate(-0 318.96 214.050312)">Fixed pixel transform → learned CNN</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="318.96" y="328.877813" transform="rotate(-0 318.96 328.877813)">Pooled color</text>
   </g>
   <g id="text_8">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="318.96" y="358.050313" transform="rotate(-0 318.96 358.050313)">Spatial RGB mean → learned MLP</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="678.96" y="234.517969" transform="rotate(-0 678.96 234.517969)">One visual token per tile</text>
   </g>
   <g id="text_10">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(678.96 264.450313)">Concatenate shape + color</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(678.96 280.400313)">Then use the existing joint model</text>
   </g>
   <g id="text_11">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #2e62bc" x="50.4" y="444.96" transform="rotate(-0 50.4 444.96)">Shape transform:</text>
   </g>
   <g id="text_12">
    <text style="font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="216" y="444.96" transform="rotate(-0 216 444.96)">clip((0.4 − max(R, G, B)) / 0.2, 0, 1)</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="50.4" y="489.6" transform="rotate(-0 50.4 489.6)">The shape map is invariant to these color interventions. This is a targeted prior, not general object segmentation.</text>
   </g>
   <g id="text_14">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="559.158047" transform="rotate(-0 39.6 559.158047)">Original generated inputs and architecture diagram. No oracle labels enter inference; performance is reported separately.</text>
   </g>
