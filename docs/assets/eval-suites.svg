   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="56.16" y="184.877812" transform="rotate(-0 56.16 184.877812)">Speech meaning</text>
   </g>
   <g id="text_5">
