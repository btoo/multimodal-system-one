    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(56.16 230.000312)">New speakers and noise</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="380.16" y="184.877812" transform="rotate(-0 380.16 184.877812)">Acoustic events</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(380.16 214.050312)">Alerts · speech · music · overlap</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(380.16 231.065937)">Silence and false activations</text>
