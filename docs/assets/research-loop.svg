   <g id="text_1">
    <text style="font-weight: 700; font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #007e78" x="39.6" y="36.397656" transform="rotate(-0 39.6 36.397656)">09 / EXPERIMENT METHODOLOGY</text>
   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">Keep the evidence—and several routes forward</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">Proposed archive-based search · each candidate is tied to a hypothesis, source revision, and budget</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="192.077812" transform="rotate(-0 52.56 192.077812)">Evidence + archive</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="52.56" y="222.315938" transform="rotate(-0 52.56 222.315938)">Sources · successes · failures</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="372.96" y="192.077812" transform="rotate(-0 372.96 192.077812)">Testable hypothesis</text>
   </g>
   <g id="text_7">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="372.96" y="221.250313" transform="rotate(-0 372.96 221.250313)">One change + expected effect</text>
   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="700.56" y="192.077812" transform="rotate(-0 700.56 192.077812)">Controlled trial</text>
   </g>
   <g id="text_9">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="700.56" y="222.315938" transform="rotate(-0 700.56 222.315938)">Fixed data and resource contract</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="700.56" y="375.677812" transform="rotate(-0 700.56 375.677812)">Independent measurement</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(700.56 404.850312)">Quality · latency · memory</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(700.56 420.800312)">Uncertainty · counterexamples</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="372.96" y="375.677812" transform="rotate(-0 372.96 375.677812)">Analysis + confirmation</text>
   </g>
   <g id="text_13">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(372.96 404.850312)">What changed? What failed?</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(372.96 420.800312)">Repeat with fresh seeds</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="52.56" y="375.677812" transform="rotate(-0 52.56 375.677812)">Archive update</text>
   </g>
   <g id="text_15">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 404.850312)">Keep complementary branches</text>
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; fill: #506477" transform="translate(52.56 421.865937)">Retain failed-trial evidence</text>
   </g>
   <g id="text_16">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="559.158047" transform="rotate(-0 39.6 559.158047)">Stop at the campaign cap. A lower development score is provisional until confirmed and independently evaluated.</text>
   </g>
