   </g>
   <g id="text_8">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="300.96" y="307.277813" transform="rotate(-0 300.96 307.277813)">Joint transformer → H</text>
   </g>
   <g id="text_9">
