   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="59.76" y="451.277812" transform="rotate(-0 59.76 451.277812)">Candidate descriptions</text>
   </g>
   <g id="text_11">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="59.76" y="481.515938" transform="rotate(-0 59.76 481.515938)">Same text encoder for each</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="344.16" y="451.277812" transform="rotate(-0 344.16 451.277812)">Read H → shared score g</text>
   </g>
