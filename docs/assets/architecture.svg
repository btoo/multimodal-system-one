    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="344.16" y="480.450312" transform="rotate(-0 344.16 480.450312)">One scalar per candidate</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="736.56" y="451.277812" transform="rotate(-0 736.56 451.277812)">Mask → softmax</text>
