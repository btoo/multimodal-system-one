   </g>
   <g id="text_2">
    <text style="font-weight: 700; font-size: 23px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="39.6" y="77.236406" transform="rotate(-0 39.6 77.236406)">A direct, question-conditioned candidate scorer</text>
   </g>
   <g id="text_3">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="39.6" y="106.278281" transform="rotate(-0 39.6 106.278281)">64×64 is a toy workload · real screens and speech have a separate evaluation contract</text>
   </g>
   <g id="text_4">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="59.76" y="168.316719" transform="rotate(-0 59.76 168.316719)">64 × 64 RGB</text>
   </g>
   <g id="text_5">
    <text style="font-size: 11px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #506477" x="59.76" y="197.490313" transform="rotate(-0 59.76 197.490313)">8 × 8 patches → 64 visual tokens</text>
   </g>
   <g id="text_6">
    <text style="font-weight: 700; font-size: 14px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #14283e" x="387.36" y="168.317812" transform="rotate(-0 387.36 168.317812)">Question text</text>
