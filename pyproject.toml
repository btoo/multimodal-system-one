[project]
name = "multimodal-system-one"
version = "0.0.1"
description = "Research and experimental design for a small native multimodal decision model"
requires-python = ">=3.11"
dependencies = [
    "huggingface-hub>=0.34,<2",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "psutil>=7,<8",
    "safetensors>=0.6,<1",
    "scipy>=1.15,<2",
    "torch>=2.9,<3",
    "transformers>=4.57,<6",
]

[dependency-groups]
docs = ["matplotlib>=3.10,<4"]
research = ["beautifulsoup4>=4.13,<5", "pypdf>=6,<7"]

[tool.uv]
package = false
