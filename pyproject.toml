[project]
name = "multimodal-system-one"
version = "0.1.0"
description = "Audited audio and screen evaluation baselines for a native multimodal decision model"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "huggingface-hub>=0.34,<2",
    "numpy>=2.2,<3",
    "pillow>=11,<13",
    "psutil>=7,<8",
    "pydantic>=2.10,<3",
    "safetensors>=0.6,<1",
    "scipy>=1.15,<2",
    "torch>=2.9,<3",
    "transformers>=4.57,<6",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
cloud = [
    "modal>=1,<2",
]
dev = ["httpx>=0.28,<1"]
docs = ["matplotlib>=3.10,<4"]
research = ["beautifulsoup4>=4.13,<5", "pypdf>=6,<7"]

[project.scripts]
mmso = "mmso.__main__:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mmso"]
